# NOTE: A full core submission was already attempted
# (home-assistant/core#165962, closed the same day) that bundled every
# platform into one PR. HA core's review bot immediately rejected it:
# "When adding new integrations, limit included platforms to a single
# platform. Please reduce this PR to a single platform." Any future
# submission needs to pick ONE platform (climate is the most mature and
# heavily used) and defer camera/lock/fan/sensor/switch/select/number/
# water_heater/event/media_source/binary_sensor to follow-up PRs.
#
# The rules below marked NOTE quote or paraphrase
# https://developers.home-assistant.io/docs/core/integration/contributing_to_core/ :
# "Limit to a single platform. Do not add features that are not essential
# for the initial platform to work. This includes features like:
# Diagnostics, Custom service actions, Reauthentication and reconfiguration
# flows" and "Ideally keep more complex integration quality scale rules
# (such as dynamic-devices and stale-devices) out."
rules:
  # Bronze
  action-setup:
    status: done
    comment: >
      NOTE: When submitting this as a core integration, remove all custom
      services (list_guests, get_user_schedule, set_user_schedule,
      delete_user_schedule, set_fan_timer) for the initial PR (see
      top-of-file note) — this rule becomes irrelevant until services are
      added back in a follow-up PR.
  appropriate-polling: done
  brands:
    status: exempt
    comment: >
      Custom (non-core) HACS integration; brand assets are served through
      HACS rather than the home-assistant/brands repository used by core
      integrations.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: done
    comment: >
      services.yaml documents all five custom services (list_guests,
      get_user_schedule, set_user_schedule, delete_user_schedule,
      set_fan_timer) with field descriptions; strings.json provides
      translatable names/descriptions for each.
      NOTE: When submitting this as a core integration, remove all custom
      services for the initial PR (see top-of-file note).
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: exempt
    comment: Standard HA config entry removal via the UI; nothing custom to document.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: >
      NOTE: When submitting this as a core integration, remove all custom
      services for the initial PR (see top-of-file note) — this rule
      becomes irrelevant until services are added back in a follow-up PR.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: >
      NOTE: When submitting this as a core integration, remove the
      reauthentication flow for the initial PR (see top-of-file note) —
      add it back in a follow-up PR.
  test-coverage: done
  # Gold
  devices: done
  diagnostics:
    status: done
    comment: >
      NOTE: When submitting this as a core integration, remove
      diagnostics.py for the initial PR (see top-of-file note) — add it
      back in a follow-up PR.
  discovery: done
  discovery-update-info:
    status: exempt
    comment: >
      DHCP discovery only triggers the existing account-based setup flow; it
      carries no per-device info (other than presence) to merge into an
      already-configured entry.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: >
      NOTE: When submitting this as a core integration, remove
      dynamic-devices logic for the initial PR (see top-of-file note).
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: >
      NOTE: When submitting this as a core integration, remove the
      reconfiguration flow for the initial PR (see top-of-file note) —
      add it back in a follow-up PR.
  repair-issues:
    status: exempt
    comment: No actionable repair scenarios currently identified for this integration.
  stale-devices:
    status: done
    comment: >
      NOTE: Same as dynamic-devices — remove for the initial core PR
      (see top-of-file note).

  # Platinum
  async-dependency:
    status: todo
    comment: >
      protobuf and bidict, used by the bundled pynest client, are
      synchronous; the client itself wraps aiohttp but pulls in sync
      dependencies for parsing.
      NOTE: When submitting this as a core integration, the bundled pynest
      client has to be extracted into a standalone PyPI package with its
      own CI/CD (mirroring pyalarmdotcomajax and pypowershades) — a core
      integration cannot vendor its own protocol client in-tree, and that
      includes the vendored protobuf_gen/ stubs.
  inject-websession: done
  strict-typing:
    status: todo
    comment: No mypy strict configuration or py.typed marker present.
