# Mirrors the mypy configuration Home Assistant core generates with hassfest,
# minus the core-only plugins and stub paths, so this component is checked here
# the same way it is upstream.
# Keep in sync with https://github.com/home-assistant/core/blob/dev/mypy.ini

[mypy]
python_version = 3.14
platform = linux
# custom_components/ is a namespace package: give mypy the repo root so
# module names match the runtime ones (custom_components.nest_legacy.*).
mypy_path = .
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
follow_imports = normal
native_parser = true
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = deprecated, explicit-override, ignore-without-code, redundant-self, truthy-iterable
disable_error_code = annotation-unchecked, import-not-found, import-untyped
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true

# Core applies these relaxations to every integration that is not listed in its
# .strict-typing file, and nest_legacy is not listed.
[mypy-custom_components.*]
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
warn_return_any = false
warn_unreachable = false
no_implicit_reexport = false

# Generated by generate_protos.py; not ours to annotate.
[mypy-custom_components.nest_legacy.pynest.protobuf_gen.*]
ignore_errors = true
